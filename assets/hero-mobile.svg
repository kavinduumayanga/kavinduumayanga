<svg xmlns="http://www.w3.org/2000/svg" width="520" height="390" viewBox="0 0 520 390" role="img" aria-labelledby="title desc">
  <title id="title">Kavindu Umayanga — Aspiring DevOps Engineer</title>
  <desc id="desc">A compact Linux terminal introduction focused on Linux, cloud, CI/CD, automation, and backend engineering.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#7ee7c4" stroke-opacity=".045"/></pattern>
    <linearGradient id="accent" x2="1"><stop stop-color="#61d6a6"/><stop offset=".55" stop-color="#5fc9e8"/><stop offset="1" stop-color="#6f8ff7"/></linearGradient>
    <clipPath id="typing"><rect x="34" y="268" width="305" height="26"><animate attributeName="width" from="0" to="305" dur="1.8s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>@media (prefers-reduced-motion:reduce){.motion{display:none}.typed{clip-path:none}}</style>
  <rect x="1" y="1" width="518" height="388" rx="18" fill="#0d1117" stroke="#33404d" stroke-width="2"/>
  <rect x="1" y="1" width="518" height="388" rx="18" fill="url(#grid)"/>
  <path d="M20 1H500" stroke="url(#accent)" stroke-width="2"/><path d="M1 49H519" stroke="#263341"/>
  <circle cx="25" cy="25" r="4" fill="#61d6a6"/><circle cx="42" cy="25" r="4" fill="#5fc9e8"/><circle cx="59" cy="25" r="4" fill="#667789"/>
  <text x="82" y="30" fill="#91a3b4" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">~/profile</text>
  <text x="28" y="85" fill="#61d6a6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">$ whoami</text>
  <text x="28" y="137" fill="#f0f6fc" font-family="system-ui,-apple-system,sans-serif" font-size="39" font-weight="700" letter-spacing="-1">Kavindu Umayanga</text>
  <text x="28" y="177" fill="#78d9e8" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600">Aspiring DevOps Engineer</text>
  <text x="28" y="211" fill="#a9b8c6" font-family="system-ui,-apple-system,sans-serif" font-size="16">Linux · Cloud · CI/CD · Automation</text>
  <text x="28" y="235" fill="#a9b8c6" font-family="system-ui,-apple-system,sans-serif" font-size="16">Software engineering background</text>
  <rect x="20" y="252" width="480" height="112" rx="11" fill="#0a0f14" stroke="#2c3e4c"/>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text class="typed" clip-path="url(#typing)" x="34" y="286" fill="#61d6a6" font-size="14">$ cat /etc/profile.d/kavindu</text>
    <text x="34" y="320" fill="#d7e1e9" font-size="14">software background →</text>
    <text x="34" y="345" fill="#d7e1e9" font-size="14">infrastructure mindset</text>
    <rect class="motion" x="254" y="271" width="8" height="18" fill="#61d6a6"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="4"/></rect>
  </g>
</svg>
