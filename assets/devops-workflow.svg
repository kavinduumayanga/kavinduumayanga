<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="280" viewBox="0 0 840 280" role="img" aria-labelledby="title desc">
<title id="title">From commit to confidence</title><desc id="desc">Learning the DevOps lifecycle: Code, Build, Test, Deploy, Monitor. Monitoring informs the next change.</desc>
<defs>
 <radialGradient id="glow"><stop stop-color="#345e49" stop-opacity=".35"/><stop offset="1" stop-color="#101619" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7da9a1" stroke-opacity=".07"/></pattern>
 <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#6c9090"/></marker>
</defs>
<style>.ink{fill:#eef4ee}@media(prefers-reduced-motion:reduce){.motion{display:none}.typing{clip-path:none}}</style>
<rect x="1" y="1" width="838" height="278" rx="20" fill="#101619" stroke="#2b383d" /><text x="32" y="35" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="500" fill="#b0e5aa" letter-spacing="1.5">THE DELIVERY LOOP</text><text x="32" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="600" fill="#eef4ee" >From commit to confidence.</text><path d="M88 135H179" fill="none" stroke="#476553" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="109" width="54" height="54" rx="13" fill="#1d3026" stroke="#49654e" /><g transform="translate(45 122) scale(1.1666666666666667)"><path d="M8 6 L2 12 L8 18 M16 6 L22 12 L16 18 M14 3 L10 21" fill="none" stroke="#b0e5aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="32" y="193" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#eef4ee" >Code</text><text x="32" y="218" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#a3b4b7" >Version the change</text><path d="M247 135H338" fill="none" stroke="#476553" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="191" y="109" width="54" height="54" rx="13" fill="#1d3026" stroke="#49654e" /><g transform="translate(204 122) scale(1.1666666666666667)"><path d="M3 7 L12 2 L21 7 L21 17 L12 22 L3 17 Z M3 7 L12 12 L21 7 M12 12 V22 M8 4 L17 9" fill="none" stroke="#b0e5aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="191" y="193" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#eef4ee" >Build</text><text x="191" y="218" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#a3b4b7" >Package the app</text><path d="M406 135H497" fill="none" stroke="#476553" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="350" y="109" width="54" height="54" rx="13" fill="#1d3026" stroke="#49654e" /><g transform="translate(363 122) scale(1.1666666666666667)"><path d="M12 2 L21 6 V12 Q21 18 12 22 Q3 18 3 12 V6 Z M7 12 L10 15 L17 8" fill="none" stroke="#b0e5aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="350" y="193" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#eef4ee" >Test</text><text x="350" y="218" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#a3b4b7" >Verify behavior</text><path d="M565 135H656" fill="none" stroke="#476553" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="509" y="109" width="54" height="54" rx="13" fill="#1d3026" stroke="#49654e" /><g transform="translate(522 122) scale(1.1666666666666667)"><path d="M4 18 H20 M12 17 V3 M6 9 L12 3 L18 9" fill="none" stroke="#b0e5aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="509" y="193" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#eef4ee" >Deploy</text><text x="509" y="218" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#a3b4b7" >Run the release</text><rect x="668" y="109" width="54" height="54" rx="13" fill="#1d3026" stroke="#49654e" /><g transform="translate(681 122) scale(1.1666666666666667)"><path d="M2 3 H22 V19 H2 Z M7 23 H17 M12 19 V23 M5 12 H8 L10 7 L14 15 L16 11 H19" fill="none" stroke="#b0e5aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="668" y="193" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#eef4ee" >Monitor</text><text x="668" y="218" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#a3b4b7" >Observe &amp; improve</text><path d="M32 244H808" fill="none" stroke="#2b383d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="264" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#77ccd0" >feedback → the next change</text><text x="808" y="264" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#a3b4b7" text-anchor="end">A lifecycle I’m learning to connect.</text><circle class="motion" r="3" fill="#b0e5aa" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="2"/><animateMotion path="M88 135H179M247 135H338M406 135H497M565 135H656" dur="5s" repeatCount="2"/></circle>
</svg>
