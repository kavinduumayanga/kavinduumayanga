<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
<title id="title">Kavindu Umayanga — Aspiring DevOps Engineer</title>
<desc id="desc">A Linux-inspired terminal introduction. Linux, cloud, and automation. Learn the system. Automate the repeatable.</desc>
<defs>
