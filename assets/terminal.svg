<text x="48" y="98" fill="#66d9b0" font-size="16">kavindu@github:~$ <tspan fill="#dbe7f3">whoami</tspan></text>
</g>
<text x="48" y="153" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.4">Kavindu Umayanga</text>
<text x="48" y="198" fill="#79d7f0" font-family="system-ui, -apple-system, sans-serif" font-size="27">Aspiring DevOps Engineer</text>
