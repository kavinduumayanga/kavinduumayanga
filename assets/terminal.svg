</defs>
<style>@media (prefers-reduced-motion: reduce) { .motion { display: none; } .typed { clip-path: none; } }</style>
<rect x="1" y="1" width="958" height="408" rx="18" fill="#0d1117" stroke="#303d4b" stroke-width="2"/>
<path d="M20 1 H940" stroke="url(#edge)" stroke-width="2"/>
<path d="M1 51 H959" stroke="#283443"/>
<g fill="#718294"><circle cx="25" cy="26" r="4"/><circle cx="41" cy="26" r="4"/><circle cx="57" cy="26" r="4"/></g>
