<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Kavindu Umayanga — Aspiring DevOps Engineer</title>
  <desc id="desc">A Linux terminal-inspired introduction focused on Linux, cloud, CI/CD, automation, and software engineering.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7ee7c4" stroke-opacity=".045"/></pattern>
    <linearGradient id="accent" x2="1"><stop stop-color="#61d6a6"/><stop offset=".55" stop-color="#5fc9e8"/><stop offset="1" stop-color="#6f8ff7"/></linearGradient>
    <clipPath id="typing"><rect x="48" y="247" width="350" height="26"><animate attributeName="width" from="0" to="350" dur="1.8s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>@media (prefers-reduced-motion:reduce){.motion{display:none}.typed{clip-path:none}}</style>
  <rect x="1" y="1" width="898" height="358" rx="18" fill="#0d1117" stroke="#33404d" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="358" rx="18" fill="url(#grid)"/>
  <path d="M20 1H880" stroke="url(#accent)" stroke-width="2"/><path d="M1 49H899" stroke="#263341"/>
  <circle cx="25" cy="25" r="4" fill="#61d6a6"/><circle cx="42" cy="25" r="4" fill="#5fc9e8"/><circle cx="59" cy="25" r="4" fill="#667789"/>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="82" y="30" fill="#91a3b4" font-size="12">kavindu@github: ~/profile</text>
    <text x="860" y="30" text-anchor="end" fill="#718395" font-size="11">LINUX / DEVOPS</text>
    <text x="48" y="84" fill="#61d6a6" font-size="15">$ whoami</text>
  </g>
  <text x="48" y="143" fill="#f0f6fc" font-family="system-ui,-apple-system,sans-serif" font-size="48" font-weight="700" letter-spacing="-1.4">Kavindu Umayanga</text>
  <text x="48" y="184" fill="#78d9e8" font-family="system-ui,-apple-system,sans-serif" font-size="25" font-weight="600">Aspiring DevOps Engineer</text>
  <text x="48" y="216" fill="#a9b8c6" font-family="system-ui,-apple-system,sans-serif" font-size="17">Linux · Cloud · CI/CD · Automation · Backend Engineering</text>
  <rect x="48" y="235" width="804" height="92" rx="11" fill="#0a0f14" stroke="#2c3e4c"/>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text class="typed" clip-path="url(#typing)" x="66" y="266" fill="#61d6a6" font-size="15">$ cat /etc/profile.d/kavindu</text>
    <text x="66" y="298" fill="#d7e1e9" font-size="15">software background → infrastructure mindset</text>
    <rect class="motion" x="302" y="251" width="8" height="18" fill="#61d6a6"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="4"/></rect>
  </g>
  <g transform="translate(630 72)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <rect width="222" height="142" rx="13" fill="#111a22" stroke="#304958"/>
    <text x="18" y="28" fill="#718395" font-size="11">PROFILE STATUS</text>
    <circle cx="20" cy="54" r="4" fill="#61d6a6"/><text x="34" y="59" fill="#d7e1e9" font-size="13">linux labs</text>
    <circle cx="20" cy="82" r="4" fill="#5fc9e8"/><text x="34" y="87" fill="#d7e1e9" font-size="13">cloud demos</text>
    <circle cx="20" cy="110" r="4" fill="#6f8ff7"/><text x="34" y="115" fill="#d7e1e9" font-size="13">backend systems</text>
    <path d="M18 126H204" stroke="#293845"/><text x="18" y="139" fill="#61d6a6" font-size="9">MODE: CONTINUOUS LEARNING</text>
  </g>
</svg>
