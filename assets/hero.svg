<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#141b3a"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.55" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/></pattern>
  <clipPath id="card"><rect width="1000" height="330" rx="22"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1000" height="330" fill="url(#bg)"/>
  <rect width="1000" height="330" fill="url(#grid)"/>
  <circle cx="180" cy="80" r="260" fill="url(#g1)"><animateTransform attributeName="transform" type="translate" values="0,0;60,30;0,0" dur="14s" repeatCount="indefinite"/></circle>
  <circle cx="860" cy="260" r="280" fill="url(#g2)"><animateTransform attributeName="transform" type="translate" values="0,0;-70,-30;0,0" dur="16s" repeatCount="indefinite"/></circle>

  <!-- orbit -->
  <g transform="translate(840,150)" fill="none">
    <circle r="112" stroke="#22d3ee" stroke-opacity="0.25" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></circle>
    <circle r="76" stroke="#818cf8" stroke-opacity="0.35" stroke-dasharray="14 10"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/></circle>
    <circle r="40" stroke="#c084fc" stroke-opacity="0.45"/>
    <g><circle cx="112" cy="0" r="6" fill="#22d3ee"/><circle cx="-76" cy="0" r="5" fill="#818cf8"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></g>
    <g><circle cx="0" cy="-40" r="4" fill="#c084fc"/><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/></g>
    <circle r="9" fill="#34d399"><animate attributeName="r" values="8;11;8" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- status -->
  <circle cx="68" cy="52" r="5" fill="#34d399"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="84" y="57" font-size="14" fill="#8b98b8">kavindu@sliit:~$ system online</text>

  <text x="58" y="146" font-size="62" font-weight="800" fill="url(#name)">Kavindu Umayanga</text>
  <text x="62" y="205" font-size="24" fill="#e6edf3" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.333;1" dur="12s" begin="0s" repeatCount="indefinite"/>Aspiring DevOps Engineer</text><text x="62" y="205" font-size="24" fill="#e6edf3" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.333;1" dur="12s" begin="4s" repeatCount="indefinite"/>Linux  /  Cloud  /  CI-CD  /  Automation</text><text x="62" y="205" font-size="24" fill="#e6edf3" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.333;1" dur="12s" begin="8s" repeatCount="indefinite"/>Software Engineering @ SLIIT</text>
  <g transform="translate(60,262)"><rect width="75" height="30" rx="15" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.35"/><text x="37.5" y="20" text-anchor="middle" font-size="13" fill="#a5f3fc">Linux</text></g><g transform="translate(147,262)"><rect width="75" height="30" rx="15" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.35"/><text x="37.5" y="20" text-anchor="middle" font-size="13" fill="#a5f3fc">Azure</text></g><g transform="translate(234,262)"><rect width="156" height="30" rx="15" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.35"/><text x="78.0" y="20" text-anchor="middle" font-size="13" fill="#a5f3fc">GitHub Actions</text></g><g transform="translate(402,262)"><rect width="66" height="30" rx="15" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.35"/><text x="33.0" y="20" text-anchor="middle" font-size="13" fill="#a5f3fc">Java</text></g><g transform="translate(480,262)"><rect width="129" height="30" rx="15" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.35"/><text x="64.5" y="20" text-anchor="middle" font-size="13" fill="#a5f3fc">Spring Boot</text></g><g transform="translate(621,262)"><rect width="84" height="30" rx="15" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.35"/><text x="42.0" y="20" text-anchor="middle" font-size="13" fill="#a5f3fc">Python</text></g>

  <rect x="-300" y="326" width="300" height="3" fill="url(#scan)"><animate attributeName="x" from="-300" to="1000" dur="5s" repeatCount="indefinite"/></rect>
</g>
<rect x="0.5" y="0.5" width="999" height="329" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
</svg>