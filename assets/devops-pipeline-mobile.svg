<svg xmlns="http://www.w3.org/2000/svg" width="520" height="450" viewBox="0 0 520 450" role="img" aria-labelledby="title desc">
  <title id="title">DevOps delivery loop</title>
  <desc id="desc">Code flows through Build, Test, CI/CD, Deploy, and Monitor. Monitoring provides feedback for the next change.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#73909e"/></marker></defs>
  <style>@media (prefers-reduced-motion:reduce){.motion{display:none}}</style>
  <rect x="1" y="1" width="518" height="448" rx="16" fill="#0d1117" stroke="#33404d" stroke-width="2"/>
  <text x="24" y="31" fill="#61d6a6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1.2">DELIVERY LOOP / LEARNING PATH</text>
  <g fill="none" stroke="#557382" stroke-width="1.5" marker-end="url(#arrow)"><path d="M115 115H145"/><path d="M260 153V183"/><path d="M145 220H115"/><path d="M70 261V285"/><path d="M115 325H145"/></g>
  <g font-family="system-ui,-apple-system,sans-serif">
    <g transform="translate(25 75)"><rect width="90" height="78" rx="11" fill="#14221f" stroke="#3b6555"/><text x="45" y="34" text-anchor="middle" fill="#61d6a6" font-size="13">01</text><text x="45" y="59" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="600">Code</text></g>
    <g transform="translate(145 75)"><rect width="230" height="78" rx="11" fill="#14221f" stroke="#3b6555"/><text x="24" y="34" fill="#61d6a6" font-size="13">02</text><text x="24" y="59" fill="#f0f6fc" font-size="16" font-weight="600">Build</text><text x="210" y="59" text-anchor="end" fill="#8da1b1" font-size="12">package</text></g>
    <g transform="translate(145 183)"><rect width="230" height="78" rx="11" fill="#14221f" stroke="#3b6555"/><text x="24" y="34" fill="#61d6a6" font-size="13">03</text><text x="24" y="59" fill="#f0f6fc" font-size="16" font-weight="600">Test</text><text x="210" y="59" text-anchor="end" fill="#8da1b1" font-size="12">verify</text></g>
    <g transform="translate(25 183)"><rect width="90" height="78" rx="11" fill="#14221f" stroke="#3b6555"/><text x="45" y="34" text-anchor="middle" fill="#61d6a6" font-size="13">04</text><text x="45" y="59" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="600">CI/CD</text></g>
    <g transform="translate(25 285)"><rect width="90" height="78" rx="11" fill="#14221f" stroke="#3b6555"/><text x="45" y="34" text-anchor="middle" fill="#61d6a6" font-size="13">05</text><text x="45" y="59" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="600">Deploy</text></g>
    <g transform="translate(145 285)"><rect width="230" height="78" rx="11" fill="#15202a" stroke="#3e6175"/><text x="24" y="34" fill="#5fc9e8" font-size="13">06</text><text x="24" y="59" fill="#f0f6fc" font-size="16" font-weight="600">Monitor</text><text x="210" y="59" text-anchor="end" fill="#8da1b1" font-size="12">observe</text></g>
  </g>
  <text x="260" y="420" text-anchor="middle" fill="#78d9e8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">feedback → the next change</text>
  <circle class="motion" r="4" fill="#61d6a6"><animateMotion path="M115 115H145M260 153V183M145 220H115M70 261V285M115 325H145" dur="5s" repeatCount="2"/><animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="2"/></circle>
</svg>
