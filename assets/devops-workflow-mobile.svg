</defs>
<style>.ink{fill:#eef4ee}@media(prefers-reduced-motion:reduce){.motion{display:none}.typing{clip-path:none}}</style>
<rect x="1" y="1" width="398" height="482" rx="20" fill="#101619" stroke="#2b383d" /><text x="26" y="35" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="500" fill="#b0e5aa" letter-spacing="1.5">THE DELIVERY LOOP</text><text x="26" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="600" fill="#eef4ee" >From commit to confidence.</text><path d="M51 148V171" fill="none" stroke="#476553" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="28" y="105" width="46" height="44" rx="11" fill="#1d3026" stroke="#49654e" /><g transform="translate(39 115) scale(1.0)"><path d="M8 6 L2 12 L8 18 M16 6 L22 12 L16 18 M14 3 L10 21" fill="none" stroke="#b0e5aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="94" y="124" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="600" fill="#eef4ee" >Code</text><text x="94" y="147" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#a3b4b7" >Version the change</text><path d="M51 213V236" fill="none" stroke="#476553" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="28" y="170" width="46" height="44" rx="11" fill="#1d3026" stroke="#49654e" /><g transform="translate(39 180) scale(1.0)"><path d="M3 7 L12 2 L21 7 L21 17 L12 22 L3 17 Z M3 7 L12 12 L21 7 M12 12 V22 M8 4 L17 9" fill="none" stroke="#b0e5aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="94" y="189" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="600" fill="#eef4ee" >Build</text><text x="94" y="212" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#a3b4b7" >Package the app</text><path d="M51 278V301" fill="none" stroke="#476553" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="28" y="235" width="46" height="44" rx="11" fill="#1d3026" stroke="#49654e" /><g transform="translate(39 245) scale(1.0)"><path d="M12 2 L21 6 V12 Q21 18 12 22 Q3 18 3 12 V6 Z M7 12 L10 15 L17 8" fill="none" stroke="#b0e5aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="94" y="254" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="600" fill="#eef4ee" >Test</text><text x="94" y="277" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#a3b4b7" >Verify behavior</text><path d="M51 343V366" fill="none" stroke="#476553" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="28" y="300" width="46" height="44" rx="11" fill="#1d3026" stroke="#49654e" /><g transform="translate(39 310) scale(1.0)"><path d="M4 18 H20 M12 17 V3 M6 9 L12 3 L18 9" fill="none" stroke="#b0e5aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="94" y="319" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="600" fill="#eef4ee" >Deploy</text><text x="94" y="342" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#a3b4b7" >Run the release</text><rect x="28" y="365" width="46" height="44" rx="11" fill="#1d3026" stroke="#49654e" /><g transform="translate(39 375) scale(1.0)"><path d="M2 3 H22 V19 H2 Z M7 23 H17 M12 19 V23 M5 12 H8 L10 7 L14 15 L16 11 H19" fill="none" stroke="#b0e5aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="94" y="384" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="600" fill="#eef4ee" >Monitor</text><text x="94" y="407" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#a3b4b7" >Observe &amp; improve</text><text x="26" y="460" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#77ccd0" >feedback → the next change</text><circle class="motion" r="3" fill="#b0e5aa" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="2"/><animateMotion path="M51 149V170M51 214V235M51 279V300M51 344V365" dur="5s" repeatCount="2"/></circle>
