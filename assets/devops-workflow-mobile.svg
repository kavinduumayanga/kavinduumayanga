<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="484" viewBox="0 0 400 484" role="img" aria-labelledby="title desc">
<title id="title">From commit to confidence</title><desc id="desc">Learning the DevOps lifecycle: Code, Build, Test, Deploy, Monitor. Monitoring informs the next change.</desc>
<defs>
 <radialGradient id="glow"><stop stop-color="#345e49" stop-opacity=".35"/><stop offset="1" stop-color="#101619" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7da9a1" stroke-opacity=".07"/></pattern>
