<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">DevOps delivery loop</title>
  <desc id="desc">Code flows through Build, Test, CI/CD, Deploy, and Monitor. Monitoring provides feedback for the next change.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#73909e"/></marker></defs>
  <style>@media (prefers-reduced-motion:reduce){.motion{display:none}}</style>
  <rect x="1" y="1" width="898" height="218" rx="16" fill="#0d1117" stroke="#33404d" stroke-width="2"/>
  <text x="28" y="31" fill="#61d6a6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1.4">DELIVERY LOOP / LEARNING PATH</text>
  <g fill="none" stroke="#557382" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M132 106H170"/><path d="M274 106H312"/><path d="M416 106H454"/><path d="M558 106H596"/><path d="M700 106H738"/>
  </g>
  <g font-family="system-ui,-apple-system,sans-serif">
    <g transform="translate(28 67)"><rect width="104" height="78" rx="11" fill="#14221f" stroke="#3b6555"/><text x="52" y="35" text-anchor="middle" fill="#61d6a6" font-size="14">01</text><text x="52" y="60" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="600">Code</text></g>
    <g transform="translate(170 67)"><rect width="104" height="78" rx="11" fill="#14221f" stroke="#3b6555"/><text x="52" y="35" text-anchor="middle" fill="#61d6a6" font-size="14">02</text><text x="52" y="60" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="600">Build</text></g>
    <g transform="translate(312 67)"><rect width="104" height="78" rx="11" fill="#14221f" stroke="#3b6555"/><text x="52" y="35" text-anchor="middle" fill="#61d6a6" font-size="14">03</text><text x="52" y="60" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="600">Test</text></g>
    <g transform="translate(454 67)"><rect width="104" height="78" rx="11" fill="#14221f" stroke="#3b6555"/><text x="52" y="35" text-anchor="middle" fill="#61d6a6" font-size="14">04</text><text x="52" y="60" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="600">CI/CD</text></g>
    <g transform="translate(596 67)"><rect width="104" height="78" rx="11" fill="#14221f" stroke="#3b6555"/><text x="52" y="35" text-anchor="middle" fill="#61d6a6" font-size="14">05</text><text x="52" y="60" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="600">Deploy</text></g>
    <g transform="translate(738 67)"><rect width="134" height="78" rx="11" fill="#15202a" stroke="#3e6175"/><text x="67" y="35" text-anchor="middle" fill="#5fc9e8" font-size="14">06</text><text x="67" y="60" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="600">Monitor</text></g>
  </g>
  <path d="M805 154V181H80V154" fill="none" stroke="#35515f" stroke-dasharray="5 6"/>
  <text x="442" y="203" text-anchor="middle" fill="#78d9e8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">feedback → the next change</text>
  <circle class="motion" r="4" fill="#61d6a6"><animateMotion path="M132 106H170M274 106H312M416 106H454M558 106H596M700 106H738" dur="5s" repeatCount="2"/><animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="2"/></circle>
</svg>
